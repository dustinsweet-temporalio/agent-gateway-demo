name: agent-gateway-approval-demo

services:
  temporal:
    build:
      context: .
      dockerfile: Dockerfile.temporal
    ports:
      - "7233:7233"
      - "8233:8233"
    volumes:
      - temporal-data:/data
    healthcheck:
      test: ["CMD", "temporal", "operator", "namespace", "describe", "-n", "default", "--address", "127.0.0.1:7233"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Registers the two Nexus Endpoints, then exits. Endpoints are cluster-level
  # objects rather than worker config: each one names a target namespace and task
  # queue, and callers address the endpoint by name and learn neither. This is
  # what lets either team restructure behind their endpoint without the other
  # team's code changing.
  #
  # Creation is idempotent here by ignoring "already exists", so repeated
  # `docker compose up` is safe.
  nexus-endpoints:
    build:
      context: .
      dockerfile: Dockerfile.temporal
    depends_on:
      temporal:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        temporal operator nexus endpoint create \
          --name agent-gateway \
          --target-namespace default \
          --target-task-queue agentic-gateway \
          --address temporal:7233 2>&1 | grep -v "already exists" || true
        temporal operator nexus endpoint create \
          --name release-safety \
          --target-namespace release-safety \
          --target-task-queue release-safety-tq \
          --address temporal:7233 2>&1 | grep -v "already exists" || true
        temporal operator nexus endpoint list --address temporal:7233

  mock-tool:
    build:
      context: .
      dockerfile: Dockerfile.app
    command: ["python", "-m", "mock_tool.server"]
    environment:
      MOCK_TOOL_PORT: "9000"
      # Cutting this release runs long and trips the gateway convert-to-async path.
      SLOW_CUT_VERSION: "2.3.1"
      SLOW_CUT_DELAY_SECONDS: "12"
      # How long the CASE-2 quality gates take. Long enough to watch the gate card
      # work, short enough to stay inside the invoke Activity's request timeout.
      QUALITY_GATE_SECONDS: "${QUALITY_GATE_SECONDS:-12}"
      # Versions the gates reject. Empty by default, so gates pass. Set it to show
      # the fail-closed path, then recreate the service to clear it.
      QUALITY_GATE_FAIL_VERSIONS: "${QUALITY_GATE_FAIL_VERSIONS:-}"
      # Same idea for canary: versions whose canary window fails. Empty by
      # default, so a canary that runs passes.
      CANARY_FAIL_VERSIONS: "${CANARY_FAIL_VERSIONS:-}"
    ports:
      - "9000:9000"

  worker:
    build:
      context: .
      dockerfile: Dockerfile.app
    command: ["python", "worker.py"]
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: "temporal:7233"
      TASK_QUEUE: "agentic-gateway"
      MOCK_TOOL_URL: "http://mock-tool:9000/invoke"
      PROTECTED_ENVIRONMENTS: "prod,production"
      AGENT_GATEWAY_MCP_URL: "http://gateway:8080/mcp"
      AGENT_GATEWAY_TOKEN: "tok_adk"
      ADK_MODEL: "${ADK_MODEL:-gemini-3.6-flash}"
      GOOGLE_API_KEY: "${GOOGLE_API_KEY:-}"
      # This worker's own namespace, and the only one it connects to. Reaching
      # the Release Safety team needs no configuration here at all: the
      # `release-safety` Nexus Endpoint is a cluster object, and the endpoint
      # name is in the code as part of the contract.
      TEMPORAL_NAMESPACE: "default"

  # The Release Safety team's canary platform. A separate process on purpose, so
  # the Temporal UI shows two workers with two identities in two namespaces
  # rather than one worker wearing two hats.
  #
  # Deliberately NOT started by default. Canary analysis is the CASE-2b beat: for
  # CASE-1 and CASE-2a this team has not shipped it yet, the pipeline's capability
  # lookup comes back empty, and the release goes from green gates straight to the
  # production approval exactly as it always did. Ship it live, mid-demo, with:
  #
  #     docker compose up -d release-safety-worker
  #
  # and the next pipeline run routes through canary and the card animates in.
  # Stopping the container takes the capability away again, because the
  # registration it heartbeats expires on its own.
  release-safety-worker:
    profiles: ["release-safety"]
    build:
      context: .
      dockerfile: Dockerfile.app
    command: ["python", "-m", "release_safety.worker"]
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: "temporal:7233"
      TEMPORAL_NAMESPACE: "release-safety"
      TASK_QUEUE: "release-safety-tq"
      # The shared observability backend canary reports window progress to.
      # Note what is absent: nothing here points at Agent Gateway. Calling them
      # goes through the `agent-gateway` Nexus Endpoint, so this team holds no
      # address, namespace, or credential for the gateway's cluster.
      RELEASE_SAFETY_METRICS_URL: "http://mock-tool:9000/invoke"
      # Which versions this team's canary rejects. Read here, on the canary
      # side, rather than relayed in by the caller.
      CANARY_FAIL_VERSIONS: "${CANARY_FAIL_VERSIONS:-}"

  gateway:
    build:
      context: .
      dockerfile: Dockerfile.app
    command: ["python", "-m", "gateway.server"]
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: "temporal:7233"
      TASK_QUEUE: "agentic-gateway"
      APPROVAL_TIMEOUT_SECONDS: "300"
      GATEWAY_PORT: "8080"
      # Read only fleet state for the dashboard's release panel.
      MOCK_TOOL_STATE_URL: "http://mock-tool:9000/state"
      PROTECTED_ENVIRONMENTS: "prod,production"
      # Static bearer-token to identity map. The gateway sets the approval
      # requester from a matching token, never from anything the agent says.
      # Connect Claude Code with: --header "Authorization: Bearer tok_dustin"
      GATEWAY_PRINCIPALS: '{"tok_dustin":"Dustin Sweet <dustin.sweet@temporal.io>","tok_abe":"Abe Roover <Abe.Roover@temporal.io>","tok_adk":"release-agent@google-adk","tok_approver":"approver@demo"}'
      GATEWAY_APPROVERS: "approver@demo,Dustin Sweet <dustin.sweet@temporal.io>,Abe Roover <Abe.Roover@temporal.io>"
      GATEWAY_DEBUG: "1"
    ports:
      - "8080:8080"

  adk-agent:
    build:
      context: .
      dockerfile: Dockerfile.app
    command: ["adk", "web", "--host", "0.0.0.0", "--port", "8000", "adk_agents"]
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      PYTHONPATH: "/app"
      TEMPORAL_ADDRESS: "temporal:7233"
      TASK_QUEUE: "agentic-gateway"
      ADK_MODEL: "${ADK_MODEL:-gemini-3.6-flash}"
    ports:
      - "8000:8000"

volumes:
  temporal-data:
