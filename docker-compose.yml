name: agent-gateway-approval-demo

services:
  temporal:
    build:
      context: .
      dockerfile: Dockerfile.temporal
    ports:
      - "7233:7233"
      - "8233:8233"
    volumes:
      - temporal-data:/data
    healthcheck:
      test: ["CMD", "temporal", "operator", "namespace", "describe", "-n", "default", "--address", "127.0.0.1:7233"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Registers the two Nexus Endpoints, then exits. Endpoints are cluster-level
  # objects rather than worker config: each one names a target namespace and task
  # queue, and callers address the endpoint by name and learn neither. This is
  # what lets either team restructure behind their endpoint without the other
  # team's code changing.
  #
  # Creation is idempotent here by ignoring "already exists", so repeated
  # `docker compose up` is safe.
  nexus-endpoints:
    build:
      context: .
      dockerfile: Dockerfile.temporal
    depends_on:
      temporal:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        temporal operator nexus endpoint create \
          --name agent-gateway \
          --target-namespace default \
          --target-task-queue agentic-gateway \
          --address temporal:7233 2>&1 | grep -v "already exists" || true
        temporal operator nexus endpoint create \
          --name security \
          --target-namespace security \
          --target-task-queue security-tq \
          --address temporal:7233 2>&1 | grep -v "already exists" || true
        temporal operator nexus endpoint list --address temporal:7233

  mock-tool:
    build:
      context: .
      dockerfile: Dockerfile.app
    command: ["python", "-m", "mock_tool.server"]
    environment:
      MOCK_TOOL_PORT: "9000"
      # Cutting this release runs long and trips the gateway convert-to-async path.
      SLOW_CUT_VERSION: "2.3.1"
      SLOW_CUT_DELAY_SECONDS: "12"
      # Versions whose security scan fails. Read on the Security team's own side
      # too; kept here so a single .env value configures the whole demo.
      SCAN_FAIL_VERSIONS: "${SCAN_FAIL_VERSIONS:-}"
    ports:
      - "9000:9000"

  worker:
    build:
      context: .
      dockerfile: Dockerfile.app
    command: ["python", "worker.py"]
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: "temporal:7233"
      TASK_QUEUE: "agentic-gateway"
      MOCK_TOOL_URL: "http://mock-tool:9000/invoke"
      PROTECTED_ENVIRONMENTS: "prod,production"
      AGENT_GATEWAY_MCP_URL: "http://gateway:8080/mcp"
      AGENT_GATEWAY_TOKEN: "tok_adk"
      ADK_MODEL: "${ADK_MODEL:-gemini-3.6-flash}"
      GOOGLE_API_KEY: "${GOOGLE_API_KEY:-}"
      # Quality gate checks are Activities on this worker now, not a call into
      # the deployment backend, so the fail-closed knob is read here. Empty by
      # default, so gates pass. Set it and recreate this service to show a
      # candidate being refused before anyone is asked to approve it.
      QUALITY_GATE_FAIL_VERSIONS: "${QUALITY_GATE_FAIL_VERSIONS:-}"
      # Same shape for the promotion health check: a version listed here fails
      # its post-deploy health check, so update_traffic_routing never runs and
      # the environment keeps serving what it was serving. Implemented and
      # correct, deliberately not part of the default scripted run.
      HEALTH_CHECK_FAIL_VERSIONS: "${HEALTH_CHECK_FAIL_VERSIONS:-}"
      # This worker's own namespace, and the only one it connects to. Reaching
      # the Security team needs no configuration here at all: the `security`
      # Nexus Endpoint is a cluster object, and the endpoint name is in the code
      # as part of the contract.
      TEMPORAL_NAMESPACE: "default"

  # The Security team's pre-prod scanning platform. A separate process on purpose,
  # so the Temporal UI shows two workers with two identities in two namespaces
  # rather than one worker wearing two hats.
  #
  # Started with everything else. `docker compose up -d` brings the whole demo up
  # and `docker compose down -v` takes it all down; there is no profile to
  # remember and none to forget under pressure in front of an audience.
  #
  # This worker being up is deliberately NOT what decides whether a release gets
  # scanned. That is the scan-mode switch on the dashboard: legacy runs the
  # Security team's old host script, platform routes through the workflow this
  # worker serves. An idle worker with nothing routed to it is invisible, so
  # CASE-1 and CASE-2a look exactly as they did while it sat behind a profile,
  # and Act One of CASE-2 stays a switch position rather than a container state.
  security-scan-worker:
    build:
      context: .
      dockerfile: Dockerfile.app
    command: ["python", "-m", "security_scan.worker"]
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: "temporal:7233"
      TEMPORAL_NAMESPACE: "security"
      TASK_QUEUE: "security-tq"
      # The shared observability backend the scan reports progress to.
      # Note what is absent: nothing here points at Agent Gateway. Calling them
      # goes through the `agent-gateway` Nexus Endpoint, so this team holds no
      # address, namespace, or credential for the gateway's cluster.
      SECURITY_SCAN_BACKEND_URL: "http://mock-tool:9000/invoke"
      # Which versions this team's scan rejects. Read here, on the Security team's
      # side, rather than relayed in by the caller.
      SCAN_FAIL_VERSIONS: "${SCAN_FAIL_VERSIONS:-}"

  gateway:
    build:
      context: .
      dockerfile: Dockerfile.app
    command: ["python", "-m", "gateway.server"]
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: "temporal:7233"
      TASK_QUEUE: "agentic-gateway"
      APPROVAL_TIMEOUT_SECONDS: "300"
      GATEWAY_PORT: "8080"
      # Read only fleet state for the dashboard's release panel.
      MOCK_TOOL_STATE_URL: "http://mock-tool:9000/state"
      PROTECTED_ENVIRONMENTS: "prod,production"
      # Static bearer-token to identity map. The gateway sets the approval
      # requester from a matching token, never from anything the agent says.
      # Connect Claude Code with: --header "Authorization: Bearer tok_dustin"
      GATEWAY_PRINCIPALS: '{"tok_dustin":"Dustin Sweet <dustin.sweet@quickmeals.com>","tok_abe":"Abe Roover <abe.roover@quickmeals.com>","tok_adk":"release-agent@google-adk","tok_approver":"approver@demo","tok_legacy_scanner":"legacy-scanner@security"}'
      GATEWAY_APPROVERS: "approver@demo,Dustin Sweet <dustin.sweet@quickmeals.com>,Abe Roover <abe.roover@quickmeals.com>"
      # Which service, if any, a principal is calling on behalf of. Read from the
      # token the same way the principal itself is, and for the same reason: a
      # caller does not get to name its own service. The Security team's legacy
      # host script authenticates as `tok_legacy_scanner`, so the promotion it
      # asks for carries caller_service=security -- which makes it the Security
      # team's to approve, and exempts it from having a second scan put in front
      # of it. Their Temporal workflow states the same thing over Nexus, so both
      # of their scanners identify identically no matter which one is in use.
      GATEWAY_PRINCIPAL_SERVICES: '{"legacy-scanner@security":"security"}'
      # Which QuickMeals engineering team each principal belongs to. Explicit and
      # auditable on purpose: an Operation gated by the Security team's scan may
      # only be approved by a Security-team member, and inferring that from an
      # email domain or a token-name pattern would break silently the first time
      # a persona's address changed. Keys may be the full principal string or
      # just the address inside it; anything absent has no team and therefore
      # cannot approve a team-restricted Operation.
      GATEWAY_PRINCIPAL_TEAMS: '{"dustin.sweet@quickmeals.com":"waypoint","abe.roover@quickmeals.com":"security"}'
      GATEWAY_DEBUG: "1"
    ports:
      - "8080:8080"

  adk-agent:
    build:
      context: .
      dockerfile: Dockerfile.app
    command: ["adk", "web", "--host", "0.0.0.0", "--port", "8000", "adk_agents"]
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      PYTHONPATH: "/app"
      TEMPORAL_ADDRESS: "temporal:7233"
      TASK_QUEUE: "agentic-gateway"
      ADK_MODEL: "${ADK_MODEL:-gemini-3.6-flash}"
    ports:
      - "8000:8000"

volumes:
  temporal-data:
